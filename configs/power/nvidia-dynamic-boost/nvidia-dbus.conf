<!-- /usr/share/dbus-1/system.d/nvidia-dbus.conf - D-Bus policy nvidia-powerd needs; not shipped by the Ubuntu package -->
<busconfig>
  <type>system</type>
  <policy user="root"><allow own="nvidia.powerd.server"/></policy>
  <policy context="default"><allow send_destination="nvidia.powerd.server"/></policy>
</busconfig>
